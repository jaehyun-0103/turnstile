services:
  turnstile-api:
    image: ${DOCKER_USERNAME:?DOCKER_USERNAME_is_required}/turnstile-api:latest
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    image: ${DOCKER_USERNAME:?DOCKER_USERNAME_is_required}/turnstile-frontend:latest
    ports:
      - "80:80"
    depends_on:
      turnstile-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/concerts || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s