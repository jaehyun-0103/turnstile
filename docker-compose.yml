services:
  mysql:
    image: mysql:8.0
    container_name: turnstile-mysql
    restart: always
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=1000
      - --innodb_flush_log_at_trx_commit=2
      - --sync_binlog=0
      - --default-time-zone=+09:00
    networks:
      - turnstile-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: turnstile-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "noeviction",
      "--tcp-keepalive", "60"
    ]
    networks:
      - turnstile-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  turnstile-api:
    build:
      context: ./backend
    container_name: turnstile-api
    restart: on-failure
    # ports:
    #   - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - turnstile-net

  frontend:
    build:
      context: ./frontend
    container_name: turnstile-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - turnstile-api
    networks:
      - turnstile-net

  prometheus:
    image: prom/prometheus:latest
    container_name: turnstile-prometheus
    restart: always
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - turnstile-net

  grafana:
    image: grafana/grafana:latest
    container_name: turnstile-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - turnstile-net

volumes:
  mysql_data:
  redis_data:

networks:
  turnstile-net:
    driver: bridge