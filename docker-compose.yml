services:
  mysql:
    image: mysql:8.0
    container_name: turnstile-mysql
    restart: always
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=1000
      - --innodb_flush_log_at_trx_commit=2  # 개발용 성능 향상
      - --sync_binlog=0                     # 개발용 성능 향상
    networks:
      - turnstile-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: turnstile-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "noeviction",
      "--save", "60", "1",
      "--tcp-keepalive", "60"
    ]
    networks:
      - turnstile-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:

networks:
  turnstile-net:
    driver: bridge