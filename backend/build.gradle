plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.turnstile'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.testcontainers:testcontainers-bom:2.0.5'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    testImplementation 'com.h2database:h2'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
}

tasks.named('test', Test) {
    useJUnitPlatform()

    jvmArgs += "-XX:+EnableDynamicAgentLoading"

    systemProperty 'spring.profiles.active', 'test'
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'

    maxParallelForks = 1

    // 격리 및 회귀 검증이 완료된 테스트만 기본 실행 대상으로 관리함.
    // 기존 로컬 데이터 의존 테스트는 전환 전까지 포함하지 않음.
    include '**/JwtProviderUnitTest.class'
    include '**/CacheEvictorUnitTest.class'
    include '**/GlobalExceptionHandlerTest.class'
    include '**/ClientInputValidationTest.class'
    include '**/ConcertServiceTest.class'
    include '**/ConcertScheduleTimeTest.class'
    include '**/ConcertCacheIntegrationTest.class'
    include '**/ReservationServiceTest.class'
    include '**/ReservationPaymentConsistencyTest.class'
    include '**/PaymentServiceTest.class'
    include '**/PaymentControllerTest.class'
    include '**/UserControllerTest.class'
    include '**/UserServiceTest.class'
    include '**/UserBalanceConsistencyTest.class'

    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
