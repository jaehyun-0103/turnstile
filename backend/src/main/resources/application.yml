spring:
  application:
    name: turnstile-api
  profiles:
    active: local

  # 1. MySQL 설정 (Docker: 3307 포트)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/turnstile?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    hikari:
      connection-timeout: 3000 # HikariCP DB 커넥션 획득 대기 시간 3초로 제한 (기본값 30초)

  # 2. JPA 설정
  jpa:
    hibernate:
      ddl-auto: update # 배포 시 수정
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # 3. Redis 설정 (Docker: 6380 포트)
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 2000 # Redis 응답 대기 시간 2초로 제한

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: turnstile-api

jwt:
  secret: "turnstile-ticketing-system-secret-key"

# 대기열 정책 설정
queue:
  policy:
    admission-batch-size: 100    # 대기열에서 활성 상태로 진입시키는 최대 유입량
    active-ttl-seconds: 300      # 활성 상태 유저의 유효 시간

# 예약 및 결제 정책 설정
reservation:
  policy:
    max-seats-per-user: 4        # 유저 1명당 최대 예매 가능 좌석 수
    hold-time-seconds: 330       # 좌석 임시 점유 유지 시간
    payment-ttl-seconds: 330     # 결제용 JWT 토큰 만료 시간