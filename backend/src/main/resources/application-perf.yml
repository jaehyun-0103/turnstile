spring:
  config:
    activate:
      on-profile: perf

  # 1. DB 커넥션 풀 증설
  datasource:
    hikari:
      maximum-pool-size: 80  # 40 -> 80
      minimum-idle: 40 # 20 -> 40
      connection-timeout: 3000 # 5000 -> 3000

  # 2. JPA 로그 비활성화
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  # 3. Redis 타임아웃 조정
  data:
    redis:
      timeout: 250 # 5000 -> 250
      lettuce:
        pool:
          max-active: 80 # 신규
          max-idle: 80 # 신규
          min-idle: 10 # 신규

# 4. WAS 쓰레드 최적화
server:
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: 200 # 400 -> 200
    accept-count: 500 # 200 -> 500
    max-connections: 4096 # 200 -> 4096
    keep-alive-timeout: 60000 # 신규
    max-keep-alive-requests: 2000 # 신규

# 로깅 레벨 조정
logging:
  level:
    root: info
    org.hibernate.SQL: warn
    org.springframework.web: info

management:
  endpoints:
    web:
      exposure:
        include: "prometheus, metrics, health, threaddump"
  metrics:
    tags:
      application: turnstile-api
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "http.server.requests": true