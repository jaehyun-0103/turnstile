name: Deploy to Production

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  # 도커 이미지 빌드 및 Docker Hub 푸시
  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v3

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 3. Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 4. Build and push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/turnstile-api:latest

      - name: 5. Build and push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/turnstile-frontend:latest

  # EC2 서버 접속 및 실행
  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 1. Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            set +x

            cd /home/ubuntu/turnstile
            git pull --ff-only origin main

            if ! sudo test -r /home/ubuntu/turnstile/.env; then
              echo "Deployment environment file is missing or unreadable."
              exit 1
            fi

            sudo docker compose version

            sudo docker compose \
              --project-name turnstile \
              --env-file /home/ubuntu/turnstile/.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              config --quiet

            sudo docker compose \
              --project-name turnstile \
              --env-file /home/ubuntu/turnstile/.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              pull turnstile-api frontend

            sudo docker compose \
              --project-name turnstile \
              --env-file /home/ubuntu/turnstile/.env \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --no-build --wait --wait-timeout 180

            echo "Deployment health checks passed."
            echo "API image ID:"
            sudo docker inspect --format '{{.Image}}' turnstile-api
            echo "Frontend image ID:"
            sudo docker inspect --format '{{.Image}}' turnstile-frontend