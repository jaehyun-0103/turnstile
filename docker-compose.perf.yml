services:
  turnstile-api:
    ports:
      - "8080:8080"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - SPRING_PROFILES_ACTIVE=perf

  ngrinder-controller:
    image: ngrinder/controller:3.5.8
    container_name: turnstile-ngrinder-controller
    restart: always
    ports:
      - "8000:80"
      - "16001:16001"
      - "12000-12009:12000-12009"
    volumes:
      - ngrinder_data:/opt/ngrinder-controller
    networks:
      - turnstile-net

  ngrinder-agent:
    image: ngrinder/agent:3.5.8
    container_name: turnstile-ngrinder-agent
    restart: always
    command: [ "turnstile-ngrinder-controller:80" ]
    depends_on:
      - ngrinder-controller
    networks:
      - turnstile-net

volumes:
  ngrinder_data: